<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informe CTR — Meta Ads</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3347;
      --accent: #e63946; --accent2: #f4a261; --accent3: #2ec4b6; --accent4: #8338ec;
      --text: #e8eaf6; --muted: #8b90a7; --green: #06d6a0; --red: #ef233c; --yellow: #ffd166;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── UPLOAD SCREEN ── */
    #upload-screen {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 40px 20px; gap: 32px;
    }
    .upload-logo { text-align: center; }
    .upload-logo h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    .upload-logo h1 span { color: var(--accent); }
    .upload-logo p { color: var(--muted); font-size: 14px; margin-top: 6px; }
    .upload-zone {
      width: 100%; max-width: 520px;
      border: 2px dashed var(--border); border-radius: 16px;
      padding: 48px 32px; text-align: center; cursor: pointer;
      transition: border-color .2s, background .2s;
      background: var(--surface);
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent3); background: rgba(46,196,182,.05);
    }
    .upload-icon { font-size: 48px; margin-bottom: 16px; }
    .upload-zone h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .upload-zone p { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    .btn-upload {
      display: inline-block; background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 700; padding: 12px 28px;
      border-radius: 8px; border: none; cursor: pointer; transition: opacity .2s;
    }
    .btn-upload:hover { opacity: .85; }
    #file-input { display: none; }
    .upload-formats { color: var(--muted); font-size: 11px; margin-top: 12px; }
    .upload-error { color: var(--red); font-size: 13px; font-weight: 600; margin-top: 8px; display: none; }

    /* ── REPORT ── */
    #report-screen { display: none; }
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .topbar h2 { font-size: 15px; font-weight: 700; }
    .topbar-meta { font-size: 12px; color: var(--muted); }
    .btn-new {
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    .btn-new:hover { background: var(--border); }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px 60px; }
    .section { margin-top: 40px; }
    .section-title {
      font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
      color: var(--muted); border-bottom: 1px solid var(--border);
      padding-bottom: 10px; margin-bottom: 18px;
    }
    .section-title span { color: var(--accent); }

    /* ── KPI ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .kpi-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px 18px; position: relative; overflow: hidden;
    }
    .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .kpi-card.green::before { background: var(--green); }
    .kpi-card.accent::before { background: var(--accent); }
    .kpi-card.yellow::before { background: var(--yellow); }
    .kpi-card.blue::before { background: var(--accent3); }
    .kpi-card.purple::before { background: var(--accent4); }
    .kpi-card.orange::before { background: var(--accent2); }
    .kpi-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .kpi-value { font-size: 26px; font-weight: 800; line-height: 1; }
    .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .kpi-card.green .kpi-value { color: var(--green); }
    .kpi-card.accent .kpi-value { color: var(--accent); }
    .kpi-card.yellow .kpi-value { color: var(--yellow); }
    .kpi-card.blue .kpi-value { color: var(--accent3); }
    .kpi-card.purple .kpi-value { color: var(--accent4); }
    .kpi-card.orange .kpi-value { color: var(--accent2); }

    /* ── CHARTS ── */
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
    .chart-card.wide { grid-column: 1 / -1; }
    .chart-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .chart-sub { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
    .chart-wrap { position: relative; height: 260px; }
    .chart-wrap.sm { height: 200px; }

    /* ── TABLE ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      background: var(--surface2); color: var(--muted); font-size: 10px;
      letter-spacing: 1.2px; text-transform: uppercase; padding: 10px 12px;
      text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap;
      cursor: pointer; user-select: none;
    }
    thead th:hover { color: var(--text); }
    thead th .sort-arrow { opacity: .4; margin-left: 4px; font-size: 9px; }
    thead th.sort-asc .sort-arrow::after { content: '▲'; opacity: 1; }
    thead th.sort-desc .sort-arrow::after { content: '▼'; opacity: 1; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 9px 12px; vertical-align: middle; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .badge.high { background: rgba(6,214,160,.15); color: var(--green); border: 1px solid rgba(6,214,160,.3); }
    .badge.mid  { background: rgba(255,209,102,.12); color: var(--yellow); border: 1px solid rgba(255,209,102,.25); }
    .badge.low  { background: rgba(239,35,60,.12); color: var(--red); border: 1px solid rgba(239,35,60,.25); }
    .bar-cell { display: flex; align-items: center; gap: 8px; }
    .bar-fill { height: 5px; border-radius: 3px; min-width: 3px; }

    /* ── INSIGHTS ── */
    .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    .insight { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; gap: 12px; }
    .insight-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .insight-icon.green { background: rgba(6,214,160,.12); }
    .insight-icon.blue { background: rgba(46,196,182,.12); }
    .insight-icon.yellow { background: rgba(255,209,102,.1); }
    .insight-icon.red { background: rgba(239,35,60,.1); }
    .insight-icon.purple { background: rgba(131,56,236,.1); }
    .insight h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .insight p { font-size: 12px; color: var(--muted); line-height: 1.55; }
    .insight p strong { color: var(--text); }

    /* ── MEJORAS ── */
    .mejoras { display: flex; flex-direction: column; gap: 10px; }
    .mejora { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; display: flex; gap: 12px; }
    .mejora-n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .mejora h4 { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
    .mejora p { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .mejora p strong { color: var(--accent2); }

    footer { border-top: 1px solid var(--border); padding: 18px 24px; text-align: center; font-size: 11px; color: var(--muted); margin-top: 40px; }

    /* ── LOADING ── */
    #loading { display: none; position: fixed; inset: 0; background: rgba(15,17,23,.85); z-index: 999; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent3); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loading"><div class="spinner"></div><p style="color:var(--muted);font-size:13px">Procesando archivo…</p></div>

<!-- UPLOAD SCREEN -->
<div id="upload-screen">
  <div class="upload-logo">
    <h1>Meta Ads — <span>CTR Report</span></h1>
    <p>Subí tu archivo de Meta Ads y el informe se genera automáticamente</p>
  </div>
  <div class="upload-zone" id="drop-zone">
    <div class="upload-icon">📊</div>
    <h3>Arrastrá tu archivo aquí</h3>
    <p>Compatible con exportaciones de Meta Ads en formato XLS o XLSX</p>
    <button class="btn-upload" onclick="document.getElementById('file-input').click()">Seleccionar archivo</button>
    <div class="upload-formats">.xlsx · .xls · .csv</div>
    <div class="upload-error" id="upload-error"></div>
  </div>
  <input type="file" id="file-input" accept=".xlsx,.xls,.csv" />
</div>

<!-- REPORT SCREEN -->
<div id="report-screen">
  <div class="topbar">
    <div class="topbar-left">
      <div>
        <div class="topbar h2" id="report-title" style="font-size:15px;font-weight:700;"></div>
        <div class="topbar-meta" id="report-meta"></div>
      </div>
    </div>
    <button class="btn-new" onclick="resetApp()">📤 Cargar nuevo archivo</button>
  </div>
  <div class="container" id="report-body"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  COLUMN MAPPING  — Spanish headers → internal keys
// ═══════════════════════════════════════════════════════
const COL = {
  'Nombre de la campaña':                    'campaign',
  'Nombre del conjunto de anuncios':         'adset',
  'Nombre del anuncio':                      'creative',
  'Tipo de resultado':                       'result_type',
  'Resultados':                              'results',
  'Impresiones':                             'impressions',
  'Alcance':                                 'reach',
  'Frecuencia':                              'frequency',
  'Clics en el enlace':                      'clicks',
  'CPM (coste por 1000 impresiones)':        'cpm',
  'CPC (Coste por clic en el enlace)':       'cpc',
  'CTR (todos)':                             'ctr',
  'CTR (tasa de clics en el enlace)':        'ctr',
  'Importe gastado (ARS)':                   'spend',
  'Edad':                                    'age',
  'Sexo':                                    'gender',
  'Inicio del informe':                      'date_start',
  'Fin del informe':                         'date_end',
};

const CHARTS = {};
let sortState = {};

// ═══════════════════════════════════════════════════════
//  FILE HANDLING
// ═══════════════════════════════════════════════════════
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) processFile(e.target.files[0]);
});

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
});

function showError(msg) {
  const el = document.getElementById('upload-error');
  el.textContent = msg; el.style.display = 'block';
}
function hideError() { document.getElementById('upload-error').style.display = 'none'; }

function processFile(file) {
  hideError();
  const allowed = ['xlsx','xls','csv'];
  const ext = file.name.split('.').pop().toLowerCase();
  if (!allowed.includes(ext)) { showError('Formato no soportado. Usá .xlsx, .xls o .csv'); return; }
  document.getElementById('loading').style.display = 'flex';
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!raw.length) throw new Error('El archivo está vacío');
      const data = normalizeData(raw);
      if (!data.length) throw new Error('No se encontraron filas con datos válidos');
      renderReport(data, file.name);
    } catch(err) {
      document.getElementById('loading').style.display = 'none';
      showError('Error al procesar: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function normalizeData(raw) {
  return raw.map(row => {
    const out = {};
    for (const [original, key] of Object.entries(COL)) {
      if (original in row) {
        const v = row[original];
        if (['impressions','reach','clicks','spend','cpm','cpc','ctr','frequency','results'].includes(key)) {
          const n = parseFloat(String(v).replace(',','.'));
          out[key] = isNaN(n) ? null : n;
        } else {
          out[key] = v === '' ? null : String(v);
        }
      }
    }
    // copy unknown columns as-is
    for (const k of Object.keys(row)) {
      if (!COL[k]) out['_'+k] = row[k];
    }
    return out;
  }).filter(r => r.adset || r.campaign);
}

// ═══════════════════════════════════════════════════════
//  CHART HELPERS
// ═══════════════════════════════════════════════════════
const DG = 'rgba(255,255,255,0.06)', DT = '#8b90a7';
Chart.defaults.color = DT;
Chart.defaults.borderColor = DG;

const BASE = {
  responsive: true, maintainAspectRatio: false,
  plugins: { legend: { display: false }, tooltip: { backgroundColor:'#1a1d27', borderColor:'#2e3347', borderWidth:1, titleColor:'#e8eaf6', bodyColor:'#8b90a7' } }
};

function colorByCTR(v) {
  return v >= 3.5 ? 'rgba(6,214,160,0.85)' : v >= 2.2 ? 'rgba(255,209,102,0.8)' : 'rgba(239,35,60,0.75)';
}
function badgeCTR(v) {
  if (v >= 3.5) return '<span class="badge high">▲ Alto</span>';
  if (v >= 2.0) return '<span class="badge mid">● Medio</span>';
  return '<span class="badge low">▼ Bajo</span>';
}
function barHTML(v, max) {
  const w = Math.round((v / max) * 90);
  const col = colorByCTR(v);
  return `<div class="bar-cell"><div class="bar-fill" style="width:${w}px;background:${col};"></div><span>${v.toFixed(2)}%</span></div>`;
}
function fmt(n, decimals=0) {
  if (n == null) return '—';
  return n.toLocaleString('es-AR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtCurrency(n) { return n == null ? '—' : '$' + fmt(n, 2); }

function destroyChart(id) { if (CHARTS[id]) { CHARTS[id].destroy(); delete CHARTS[id]; } }

function makeChart(id, config) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (ctx) CHARTS[id] = new Chart(ctx, config);
}

// ═══════════════════════════════════════════════════════
//  AGGREGATION HELPERS
// ═══════════════════════════════════════════════════════
function groupBy(data, key, metrics) {
  const map = {};
  for (const row of data) {
    const k = row[key] || '(sin nombre)';
    if (!map[k]) {
      map[k] = { _key: k, _count: 0 };
      for (const m of metrics) map[k][m] = [];
    }
    map[k]._count++;
    for (const m of metrics) {
      if (row[m] != null) map[k][m].push(row[m]);
    }
  }
  const result = [];
  for (const [k, v] of Object.entries(map)) {
    const obj = { _key: k };
    for (const m of metrics) {
      const arr = v[m];
      if (!arr.length) { obj[m] = null; continue; }
      if (['impressions','reach','clicks','spend'].includes(m)) obj[m] = arr.reduce((a,b)=>a+b,0);
      else obj[m] = arr.reduce((a,b)=>a+b,0) / arr.length;
    }
    result.push(obj);
  }
  return result;
}

function sum(data, key) { return data.reduce((a,r) => a + (r[key] ?? 0), 0); }
function avg(data, key) { const vals = data.map(r=>r[key]).filter(v=>v!=null); return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0; }
function safeName(n) { return (n||'').replace('Expansion_','').replace('_Intereses','').replace(/_/g,' '); }

// ═══════════════════════════════════════════════════════
//  RENDER REPORT
// ═══════════════════════════════════════════════════════
function renderReport(data, filename) {
  const hasSpend    = data.some(r => r.spend    != null);
  const hasCPC      = data.some(r => r.cpc      != null);
  const hasCPM      = data.some(r => r.cpm      != null);
  const hasClicks   = data.some(r => r.clicks   != null);
  const hasAge      = data.some(r => r.age      != null);
  const hasGender   = data.some(r => r.gender   != null);
  const hasCreative = data.some(r => r.creative != null);
  const hasCTR      = data.some(r => r.ctr      != null);

  const dateStart = data.find(r=>r.date_start)?.date_start || '';
  const dateEnd   = data.find(r=>r.date_end)?.date_end || '';
  const campaign  = data.find(r=>r.campaign)?.campaign || filename;

  // Global KPIs
  const totalImpressions = sum(data,'impressions');
  const totalReach       = sum(data,'reach');
  const totalClicks      = hasClicks ? sum(data,'clicks') : null;
  const totalSpend       = hasSpend  ? sum(data,'spend')  : null;
  const avgCTR           = hasCTR    ? avg(data,'ctr')    : null;
  const avgCPM           = hasCPM    ? avg(data,'cpm')    : null;
  const avgCPC           = hasCPC    ? avg(data,'cpc')    : null;

  // Ad set aggregation
  const metrics = ['impressions','reach','clicks','spend','ctr','cpm','cpc'].filter(m=>data.some(r=>r[m]!=null));
  const byAdSet = groupBy(data, 'adset', metrics).sort((a,b)=>(b.ctr??0)-(a.ctr??0));
  const maxCTR  = Math.max(...byAdSet.map(r=>r.ctr??0));

  // Segment aggregations
  const byAge      = hasAge      ? groupBy(data,'age',['impressions','reach','clicks','spend','ctr','cpm','cpc']).sort((a,b)=>{const o=['18-24','25-34','35-44','45-54','55-64','65+','Unknown'];return o.indexOf(a._key)-o.indexOf(b._key);}) : null;
  const byGender   = hasGender   ? groupBy(data,'gender',['impressions','reach','clicks','spend','ctr','cpm','cpc']) : null;
  const byCreative = hasCreative ? groupBy(data,'creative',['impressions','reach','clicks','spend','ctr','cpm','cpc']).sort((a,b)=>(b.ctr??0)-(a.ctr??0)) : null;

  // Build HTML
  document.getElementById('report-title').textContent = campaign;
  document.getElementById('report-meta').textContent = dateStart && dateEnd ? `📅 ${dateStart}  →  ${dateEnd}` : '';

  let html = '';

  // ── 01 KPIs ──
  html += `<div class="section"><div class="section-title"><span>01</span> — Métricas Globales</div><div class="kpi-grid">`;
  if (hasCTR)    html += kpiCard('green',  'CTR Promedio', avgCTR.toFixed(2)+'%', 'Tasa de clics en el enlace');
  if (hasSpend)  html += kpiCard('accent', 'Inversión',    '$'+fmt(totalSpend), 'ARS — período completo');
  html += kpiCard('yellow', 'Impresiones', fmt(totalImpressions), 'Total del período');
  html += kpiCard('blue',   'Alcance',     fmt(totalReach), 'Personas únicas');
  if (hasClicks) html += kpiCard('purple', 'Clics',        fmt(totalClicks), 'Clics en el enlace');
  if (hasCPC)    html += kpiCard('orange', 'CPC Promedio', '$'+avgCPC.toFixed(2), 'ARS por clic');
  html += `</div></div>`;

  // ── 02 CTR chart by adset ──
  html += `<div class="section"><div class="section-title"><span>02</span> — CTR por Conjunto de Anuncios</div>
    <div class="chart-card wide"><div class="chart-title">CTR por Conjunto de Anuncios</div>
    <div class="chart-sub">Ordenado de mayor a menor — verde ≥ 3.5% | amarillo ≥ 2.0% | rojo &lt; 2.0%</div>
    <div class="chart-wrap"><canvas id="chartAdSet"></canvas></div></div></div>`;

  // ── 03 Table ──
  html += `<div class="section"><div class="section-title"><span>03</span> — Tabla de Rendimiento por Zona</div><div class="table-wrap">`;
  html += `<table id="tbl-adset"><thead><tr>`;
  html += thSort('Zona', 'adset_name');
  html += thSort('Impresiones', 'impressions');
  html += thSort('Alcance', 'reach');
  if (hasSpend)  html += thSort('Inversión (ARS)', 'spend');
  html += thSort('CTR', 'ctr');
  if (hasClicks) html += thSort('Clics', 'clicks');
  if (hasCPM)    html += thSort('CPM (ARS)', 'cpm');
  if (hasCPC)    html += thSort('CPC (ARS)', 'cpc');
  html += `<th>Estado</th></tr></thead><tbody id="tbody-adset">`;
  html += renderAdSetRows(byAdSet, maxCTR, hasSpend, hasClicks, hasCPM, hasCPC);
  html += `</tbody></table></div></div>`;

  // ── 04 Segment charts ──
  let segCharts = '';
  if (byAge) {
    segCharts += `<div class="chart-card"><div class="chart-title">CTR por Grupo Etario</div>
      <div class="chart-sub">Promedio por rango de edad</div>
      <div class="chart-wrap"><canvas id="chartAge"></canvas></div></div>`;
  }
  if (byGender) {
    segCharts += `<div class="chart-card"><div class="chart-title">CTR por Género</div>
      <div class="chart-sub">Femenino / Masculino / Desconocido</div>
      <div class="chart-wrap sm"><canvas id="chartGender"></canvas></div></div>`;
  }
  if (byCreative) {
    segCharts += `<div class="chart-card"><div class="chart-title">CTR por Creatividad</div>
      <div class="chart-sub">Comparativa de formatos de anuncio</div>
      <div class="chart-wrap sm"><canvas id="chartCreative"></canvas></div></div>`;
  }
  // Spend vs clicks bubble (always show if we have enough data)
  if (byAdSet.length >= 2) {
    segCharts += `<div class="chart-card"><div class="chart-title">Inversión vs. Clics por Zona</div>
      <div class="chart-sub">${hasSpend ? 'Gasto' : 'Impresiones'} vs clics — tamaño = alcance</div>
      <div class="chart-wrap"><canvas id="chartBubble"></canvas></div></div>`;
  }
  if (segCharts) {
    html += `<div class="section"><div class="section-title"><span>04</span> — Análisis por Segmento</div><div class="chart-grid">${segCharts}</div></div>`;
  }

  // ── 05 Creative table ──
  if (byCreative) {
    html += `<div class="section"><div class="section-title"><span>05</span> — Rendimiento por Creatividad</div><div class="table-wrap"><table><thead><tr>`;
    html += `<th>Creatividad</th><th>Impresiones</th><th>Alcance</th>`;
    if (hasSpend)  html += `<th>Inversión (ARS)</th>`;
    html += `<th>CTR</th>`;
    if (hasClicks) html += `<th>Clics</th>`;
    if (hasCPC)    html += `<th>CPC (ARS)</th>`;
    html += `<th>Evaluación</th></tr></thead><tbody>`;
    const maxCTRc = Math.max(...byCreative.map(r=>r.ctr??0));
    for (const r of byCreative) {
      html += `<tr><td><b>${r._key||'—'}</b></td>`;
      html += `<td>${fmt(r.impressions)}</td><td>${fmt(r.reach)}</td>`;
      if (hasSpend)  html += `<td>${fmtCurrency(r.spend)}</td>`;
      html += `<td>${r.ctr!=null ? barHTML(r.ctr, maxCTRc) : '—'}</td>`;
      if (hasClicks) html += `<td>${fmt(r.clicks)}</td>`;
      if (hasCPC)    html += `<td>${fmtCurrency(r.cpc)}</td>`;
      html += `<td>${r.ctr!=null ? badgeCTR(r.ctr) : '—'}</td></tr>`;
    }
    html += `</tbody></table></div></div>`;
  }

  // ── 06 Insights ──
  const insights = buildInsights(byAdSet, byAge, byGender, byCreative, avgCTR, hasSpend, hasCPC);
  if (insights.length) {
    html += `<div class="section"><div class="section-title"><span>06</span> — CTR Positivos Identificados</div><div class="insights-grid">`;
    for (const i of insights) html += `<div class="insight"><div class="insight-icon ${i.color}">${i.icon}</div><div><h4>${i.title}</h4><p>${i.body}</p></div></div>`;
    html += `</div></div>`;
  }

  // ── 07 Mejoras ──
  const mejoras = buildMejoras(byAdSet, byAge, byGender, byCreative, avgCTR, hasSpend, hasCPC);
  html += `<div class="section"><div class="section-title"><span>07</span> — Mejoras Recomendadas</div><div class="mejoras">`;
  for (let i=0; i<mejoras.length; i++) {
    html += `<div class="mejora"><div class="mejora-n">${i+1}</div><div><h4>${mejoras[i].title}</h4><p>${mejoras[i].body}</p></div></div>`;
  }
  html += `</div></div>`;

  html += `<footer>Informe generado automáticamente · ${filename} · ${new Date().toLocaleDateString('es-AR',{year:'numeric',month:'long',day:'numeric'})}</footer>`;

  document.getElementById('report-body').innerHTML = html;
  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('report-screen').style.display = 'block';
  document.getElementById('loading').style.display = 'none';

  // Render charts after DOM update
  requestAnimationFrame(() => {
    renderAdSetChart(byAdSet);
    if (byAge)      renderAgeChart(byAge);
    if (byGender)   renderGenderChart(byGender);
    if (byCreative) renderCreativeChart(byCreative);
    renderBubbleChart(byAdSet, hasSpend, hasClicks);
    setupTableSort(byAdSet, maxCTR, hasSpend, hasClicks, hasCPM, hasCPC);
  });
}

function kpiCard(cls, label, value, sub) {
  return `<div class="kpi-card ${cls}"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></div>`;
}
function thSort(label, key) {
  return `<th data-sort="${key}" onclick="sortTable(this)">${label}<span class="sort-arrow"></span></th>`;
}

function renderAdSetRows(rows, maxCTR, hasSpend, hasClicks, hasCPM, hasCPC) {
  let html = '';
  for (const r of rows) {
    const name = safeName(r._key);
    html += `<tr>
      <td><b>${name}</b></td>
      <td>${fmt(r.impressions)}</td>
      <td>${fmt(r.reach)}</td>
      ${hasSpend  ? `<td>${fmtCurrency(r.spend)}</td>` : ''}
      <td>${r.ctr!=null ? barHTML(r.ctr, maxCTR) : '—'}</td>
      ${hasClicks ? `<td>${fmt(r.clicks)}</td>` : ''}
      ${hasCPM    ? `<td>${fmtCurrency(r.cpm)}</td>` : ''}
      ${hasCPC    ? `<td>${fmtCurrency(r.cpc)}</td>` : ''}
      <td>${r.ctr!=null ? badgeCTR(r.ctr) : '—'}</td>
    </tr>`;
  }
  return html;
}

// ── Sort ──
let _lastSortKey = null, _lastSortAsc = false;
let _sortData = null, _sortMeta = null;

function setupTableSort(rows, maxCTR, hasSpend, hasClicks, hasCPM, hasCPC) {
  _sortData = rows; _sortMeta = [maxCTR, hasSpend, hasClicks, hasCPM, hasCPC];
}

function sortTable(th) {
  const key = th.dataset.sort;
  const asc = _lastSortKey === key ? !_lastSortAsc : false;
  _lastSortKey = key; _lastSortAsc = asc;

  document.querySelectorAll('#tbl-adset thead th').forEach(t => {
    t.classList.remove('sort-asc','sort-desc');
    t.querySelector('.sort-arrow').textContent = '';
  });
  th.classList.add(asc ? 'sort-asc' : 'sort-desc');

  const sorted = [..._sortData].sort((a, b) => {
    let va = key === 'adset_name' ? safeName(a._key) : (a[key] ?? -Infinity);
    let vb = key === 'adset_name' ? safeName(b._key) : (b[key] ?? -Infinity);
    if (typeof va === 'string') return asc ? va.localeCompare(vb) : vb.localeCompare(va);
    return asc ? va - vb : vb - va;
  });

  const [maxCTR, hasSpend, hasClicks, hasCPM, hasCPC] = _sortMeta;
  document.getElementById('tbody-adset').innerHTML = renderAdSetRows(sorted, maxCTR, hasSpend, hasClicks, hasCPM, hasCPC);
}

// ── Charts ──
function renderAdSetChart(rows) {
  const labels = rows.map(r => safeName(r._key));
  const values = rows.map(r => r.ctr ?? 0);
  makeChart('chartAdSet', {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: values.map(colorByCTR), borderRadius: 6, borderSkipped: false }] },
    options: { ...BASE, indexAxis: 'y', scales: { x: { grid:{color:DG}, ticks:{callback:v=>v+'%',color:DT} }, y: { grid:{display:false}, ticks:{color:'#e8eaf6',font:{size:12}} } }, plugins: { ...BASE.plugins, tooltip: { ...BASE.plugins.tooltip, callbacks: { label: ctx => ` CTR: ${ctx.raw.toFixed(2)}%` } } } }
  });
}

function renderAgeChart(rows) {
  const labels = rows.map(r => r._key);
  const values = rows.map(r => r.ctr ?? 0);
  makeChart('chartAge', {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: values.map(colorByCTR), borderRadius: 6, borderSkipped: false }] },
    options: { ...BASE, scales: { y: { grid:{color:DG}, ticks:{callback:v=>v+'%',color:DT} }, x:{grid:{display:false}} }, plugins: { ...BASE.plugins, tooltip: { ...BASE.plugins.tooltip, callbacks: { label: ctx => ` CTR: ${ctx.raw.toFixed(2)}%` } } } }
  });
}

function renderGenderChart(rows) {
  const labels = rows.map(r => `${r._key} (${(r.ctr??0).toFixed(2)}%)`);
  const values = rows.map(r => r.ctr ?? 0);
  const colors = ['rgba(244,162,97,0.85)','rgba(46,196,182,0.85)','rgba(131,56,236,0.8)','rgba(255,209,102,0.8)'];
  makeChart('chartGender', {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: colors.slice(0,rows.length), borderWidth:2, borderColor:'#1a1d27', hoverOffset:8 }] },
    options: { ...BASE, plugins: { ...BASE.plugins, legend: { display:true, position:'bottom', labels:{color:DT,padding:10,font:{size:11},boxWidth:12} }, tooltip: { ...BASE.plugins.tooltip, callbacks: { label: ctx => ` ${ctx.label}` } } } }
  });
}

function renderCreativeChart(rows) {
  const labels = rows.map(r => r._key);
  const values = rows.map(r => r.ctr ?? 0);
  makeChart('chartCreative', {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: values.map(colorByCTR), borderRadius: 6, borderSkipped: false }] },
    options: { ...BASE, scales: { y: { grid:{color:DG}, ticks:{callback:v=>v+'%',color:DT}, min: Math.max(0, Math.min(...values)-0.5) }, x:{grid:{display:false}} }, plugins: { ...BASE.plugins, tooltip: { ...BASE.plugins.tooltip, callbacks: { label: ctx => ` CTR: ${ctx.raw.toFixed(2)}%` } } } }
  });
}

function renderBubbleChart(rows, hasSpend, hasClicks) {
  const xKey = hasSpend ? 'spend' : 'impressions';
  const yKey = hasClicks ? 'clicks' : 'reach';
  const maxR  = Math.max(...rows.map(r=>r.reach??0));
  const datasets = rows.map(r => ({
    label: safeName(r._key),
    data: [{ x: r[xKey]??0, y: r[yKey]??0, r: Math.max(5, Math.round((r.reach??1)/maxR*16)+4) }],
    backgroundColor: colorByCTR(r.ctr??0).replace('0.8','0.7').replace('0.85','0.75'),
    borderWidth: 1
  }));
  makeChart('chartBubble', {
    type: 'bubble',
    data: { datasets },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins: { legend:{display:false}, tooltip: { backgroundColor:'#1a1d27', borderColor:'#2e3347', borderWidth:1, titleColor:'#e8eaf6', bodyColor:'#8b90a7', callbacks: { title: ctx => ctx[0].dataset.label, label: ctx => [ ` ${hasSpend?'Inversión':'Impresiones'}: ${hasSpend?'$':''}${fmt(ctx.raw.x)}`, ` ${hasClicks?'Clics':'Alcance'}: ${fmt(ctx.raw.y)}` ] } } },
      scales: {
        x: { grid:{color:DG}, ticks:{color:DT, callback: v => hasSpend ? '$'+fmt(v) : fmt(v)}, title:{display:true, text: hasSpend?'Inversión (ARS)':'Impresiones', color:DT, font:{size:11}} },
        y: { grid:{color:DG}, ticks:{color:DT}, title:{display:true, text: hasClicks?'Clics':'Alcance', color:DT, font:{size:11}} }
      }
    }
  });
}

// ═══════════════════════════════════════════════════════
//  INSIGHTS & MEJORAS — generados dinámicamente
// ═══════════════════════════════════════════════════════
function buildInsights(byAdSet, byAge, byGender, byCreative, avgCTR, hasSpend, hasCPC) {
  const ins = [];

  // Top adset by CTR
  const top = byAdSet[0];
  if (top?.ctr) {
    ins.push({ icon:'📍', color:'green', title:`${safeName(top._key)} lidera con ${top.ctr.toFixed(2)}% CTR`, body: `Mayor tasa de clics de la campaña. ${top.cpm!=null?`CPM: $${top.cpm.toFixed(0)} ARS.`:''}  <strong>Candidato prioritario para escalar presupuesto.</strong>` });
  }
  // 2nd best
  if (byAdSet[1]?.ctr && byAdSet[1].ctr >= 2.5) {
    const r = byAdSet[1];
    ins.push({ icon:'🔥', color:'green', title:`${safeName(r._key)}: ${r.ctr.toFixed(2)}% CTR`, body: `Segundo mejor conjunto. ${hasCPC && r.cpc ? `CPC de $${r.cpc.toFixed(2)} ARS.` : ''} <strong>Buena relación costo-resultado.</strong>` });
  }
  // Best CPC
  if (hasCPC) {
    const bestCPC = [...byAdSet].filter(r=>r.cpc!=null).sort((a,b)=>a.cpc-b.cpc)[0];
    if (bestCPC) ins.push({ icon:'💰', color:'yellow', title:`${safeName(bestCPC._key)}: CPC más bajo ($${bestCPC.cpc.toFixed(2)} ARS)`, body: `El costo por clic más económico de toda la campaña. <strong>Mayor eficiencia de inversión.</strong>` });
  }
  // Best age
  if (byAge) {
    const bestAge = [...byAge].filter(r=>r.ctr!=null).sort((a,b)=>(b.ctr??0)-(a.ctr??0))[0];
    if (bestAge) ins.push({ icon:'👥', color:'blue', title:`Segmento ${bestAge._key} años: ${bestAge.ctr.toFixed(2)}% CTR`, body: `El rango etario más receptivo de la campaña. <strong>Segmento prioritario para targeting futuro.</strong>` });
  }
  // Best creative
  if (byCreative) {
    const bestC = byCreative[0];
    if (bestC?.ctr) ins.push({ icon:'🖼️', color:'blue', title:`${bestC._key}: Formato estrella (${bestC.ctr.toFixed(2)}% CTR)`, body: `Mejor creatividad de la campaña. ${hasCPC&&bestC.cpc ? `CPC $${bestC.cpc.toFixed(2)} ARS.` : ''} <strong>El formato más eficiente.</strong>` });
  }
  // Overall CTR vs benchmark
  if (avgCTR != null) {
    const above = avgCTR >= 2.0;
    ins.push({ icon:'📊', color: above?'green':'yellow', title:`CTR global ${avgCTR.toFixed(2)}% — ${above?'por encima':'cerca'} del benchmark`, body: `El promedio industria para restaurantes en Meta Ads ronda el 1–2%. <strong>${above?'La campaña supera el promedio del sector.':'Hay margen para mejorar el CTR global.'}</strong>` });
  }
  return ins;
}

function buildMejoras(byAdSet, byAge, byGender, byCreative, avgCTR, hasSpend, hasCPC) {
  const m = [];
  const sorted = [...byAdSet].sort((a,b)=>(b.ctr??0)-(a.ctr??0));
  const top2 = sorted.slice(0,2).map(r=>safeName(r._key));
  const bottom2 = sorted.slice(-2).filter(r=>r.ctr!=null&&r.ctr<2.2).map(r=>safeName(r._key));

  m.push({ title:`Escalar presupuesto en ${top2.join(' y ')}`, body: `Estos conjuntos tienen las mayores tasas de CTR. Mover presupuesto desde los de peor desempeño puede aumentar clics sin incrementar el gasto total.` });

  if (bottom2.length) {
    const worst = bottom2[0];
    const worstData = byAdSet.find(r=>safeName(r._key)===worst);
    const cpm = worstData?.cpm;
    m.push({ title:`Revisar segmentación en ${bottom2.join(' y ')}`, body: `${bottom2.length>1?'Estas zonas tienen':'Esta zona tiene'} el CTR más bajo de la campaña.${cpm ? ` CPM de <strong>$${cpm.toFixed(0)} ARS</strong>.` : ''} Revisar audiencias de intereses y probar creatividades alternativas.` });
  }

  if (byAge) {
    const worstAge = [...byAge].filter(r=>r.ctr!=null).sort((a,b)=>(a.ctr??0)-(b.ctr??0)).slice(0,2).map(r=>r._key).join(' y ');
    const bestAge  = [...byAge].filter(r=>r.ctr!=null).sort((a,b)=>(b.ctr??0)-(a.ctr??0))[0];
    if (worstAge && bestAge) m.push({ title:`Optimizar segmentos de edad ${worstAge}`, body: `Tienen el CTR más bajo. El rango <strong>${bestAge._key}</strong> (${bestAge.ctr.toFixed(2)}%) responde mejor. Considerar ajustar bid por edad o crear creatividades específicas para los rangos jóvenes.` });
  }

  if (byCreative) {
    const worstC = [...byCreative].filter(r=>r.ctr!=null).sort((a,b)=>(a.ctr??0)-(b.ctr??0))[0];
    const bestC  = byCreative[0];
    if (worstC && bestC && worstC._key !== bestC._key) {
      const diff = bestC.ctr!=null && worstC.ctr!=null ? ((bestC.ctr/worstC.ctr-1)*100).toFixed(0) : null;
      m.push({ title:`Reemplazar o refrescar "${worstC._key}"`, body: `Tiene el CTR más bajo (${worstC.ctr?.toFixed(2)||'—'}%)${hasCPC&&worstC.cpc?` y el CPC más alto ($${worstC.cpc.toFixed(2)} ARS)`:''}. La creatividad "${bestC._key}" performa <strong>${diff?diff+'% mejor':' significativamente mejor'}</strong>.` });
    }
  }

  m.push({ title:'Crear variantes de anuncio localizadas por región', body: 'El mismo copy para todas las zonas limita la relevancia. Adaptar el texto a cada ciudad (referencias locales, nombres propios, contexto cultural) puede elevar el CTR promedio regional en 1–2 puntos porcentuales.' });

  if (byAge) {
    const bestAge = [...byAge].filter(r=>r.ctr!=null).sort((a,b)=>(b.ctr??0)-(a.ctr??0))[0];
    if (bestAge) m.push({ title:`Aumentar presupuesto en el segmento ${bestAge._key} años`, body: `Este rango tiene el mayor CTR (${bestAge.ctr.toFixed(2)}%) de toda la campaña. Priorizar este segmento en los conjuntos de mejor desempeño puede maximizar el rendimiento de la inversión.` });
  }

  m.push({ title:'Configurar A/B test de audiencias en las zonas medio', body: 'Para las zonas con CTR entre 2.0%–3.0%, probar una variante de audiencia basada en lookalike (LAL 1%) vs la segmentación actual de intereses. Asignar el 20% del presupuesto al test por 7 días.' });

  return m;
}

// ═══════════════════════════════════════════════════════
//  RESET
// ═══════════════════════════════════════════════════════
function resetApp() {
  Object.keys(CHARTS).forEach(id => { CHARTS[id].destroy(); delete CHARTS[id]; });
  document.getElementById('report-screen').style.display = 'none';
  document.getElementById('upload-screen').style.display = 'flex';
  document.getElementById('file-input').value = '';
  document.getElementById('report-body').innerHTML = '';
  hideError();
}
</script>
